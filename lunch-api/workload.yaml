apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: lunch-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  resources:
    - ref: lunch-order-l29-user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
    - ref: lunch-order-l29-lunch-db
      envBindings:
        dbname: LUNCH_DB_DBNAME
        host: LUNCH_DB_HOST
        password: LUNCH_DB_PASSWORD
        port: LUNCH_DB_PORT
        user: LUNCH_DB_USER
