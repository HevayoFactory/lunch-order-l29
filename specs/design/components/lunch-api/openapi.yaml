openapi: 3.0.3
info:
  title: Lunch Order API
  version: 0.1.0
servers:
  - url: /
security:
  - oauth2: []
paths:
  /published-menus/today:
    get:
      operationId: getPublishedMenu
      summary: Today's menu as staff see it, once published
      security:
        - oauth2: [menus:read]
      responses:
        '200':
          description: Today's published menu, open or closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /menus/today:
    get:
      operationId: getMenuForManagement
      summary: Today's menu in any status, for the office manager
      security:
        - oauth2: [menus:manage]
      responses:
        '200':
          description: Today's menu; draft with no items when nothing has been entered yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: saveMenuItems
      summary: Set the items of today's menu (creates it as a draft if absent)
      security:
        - oauth2: [menus:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemsInput'
      responses:
        '200':
          description: The saved menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /menus/today/publish:
    post:
      operationId: publishMenu
      summary: Publish today's menu so staff can order
      security:
        - oauth2: [menus:manage]
      responses:
        '200':
          description: The published menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /menus/today/close:
    post:
      operationId: closeOrdering
      summary: Close ordering for today, for good
      security:
        - oauth2: [menus:close]
      responses:
        '200':
          description: The closed menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/orders/today:
    get:
      operationId: getMyOrder
      summary: The caller's order for today
      security:
        - oauth2: [orders:read]
      responses:
        '200':
          description: The caller's order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: saveMyOrder
      summary: Place or change the caller's order while ordering is open
      security:
        - oauth2: [orders:place]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '200':
          description: The saved order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: cancelMyOrder
      summary: Cancel the caller's order while ordering is open
      security:
        - oauth2: [orders:place]
      responses:
        '204':
          description: The order is cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/today:
    get:
      operationId: listOrders
      summary: Every person's order for today, sorted by staff name A to Z
      security:
        - oauth2: [orders:read-all]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of today's orders, with the menu status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            menus:read: See today's published menu
            menus:manage: Create, edit and publish today's menu
            menus:close: Close ordering for today
            orders:read: See the caller's own order
            orders:place: Place, change or cancel the caller's own order
            orders:read-all: See every person's order
  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not signed in or not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Nothing there for today
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The menu's status does not allow this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    MenuItem:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
    MenuItemInput:
      type: object
      required: [name]
      properties:
        id: { type: string, description: existing item id to keep; omit for a new item }
        name: { type: string }
        description: { type: string }
    MenuItemsInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemInput'
    Menu:
      type: object
      required: [date, status, items]
      properties:
        date: { type: string, format: date }
        status: { type: string, enum: [draft, open, closed] }
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
    OrderInput:
      type: object
      required: [menuItemIds]
      properties:
        menuItemIds:
          type: array
          minItems: 1
          items: { type: string }
    Order:
      type: object
      required: [id, staffName, items]
      properties:
        id: { type: string }
        staffName: { type: string, description: display name of the person who ordered }
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
    OrderPage:
      type: object
      required: [count, menuStatus, data]
      properties:
        count: { type: integer, description: total orders today }
        menuStatus: { type: string, enum: [draft, open, closed] }
        next: { type: string, nullable: true, description: relative URI of the next page }
        previous: { type: string, nullable: true, description: relative URI of the previous page }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
